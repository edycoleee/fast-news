services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newshub}
      POSTGRES_USER: ${POSTGRES_USER:-newshub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - newshub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newshub} -d ${POSTGRES_DB:-newshub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://newshub:change_me@db:5432/newshub}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - newshub-network
    expose:
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - newshub-network
    expose:
      - "5173"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - newshub-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backup:
    image: postgres:16-alpine
    profiles: ["ops"]
    environment:
      DATABASE_URL: ${BACKUP_DATABASE_URL:-postgresql://newshub:change_me@db:5432/newshub}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./scripts/backup_database.sh:/opt/newshub/backup_database.sh:ro
      - ./scripts/verify_backup.sh:/opt/newshub/verify_backup.sh:ro
      - backup_data:/backups
    command: ["sh", "/opt/newshub/backup_database.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - newshub-network

  cleanup:
    build:
      context: ./backend
    profiles: ["ops"]
    command: python -m scripts.cleanup_security_data
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://newshub:change_me@db:5432/newshub}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - newshub-network

volumes:
  postgres_data:
  backup_data:

networks:
  newshub-network:
    driver: bridge
